openapi: 3.0.3
info:
  title: ITEMDEX API
  version: 2.0.0
  description: |
    Turn photos/videos of physical items into collectible "cards" using an AI vision model (Claude, DeepSeek, Gemini, OpenAI, Ollama or any OpenAI-compatible server; set in the app or with LLM_*):
    identification, estimated size/weight/condition, second-hand market value, rarity,
    plus "last seen" location tracking.

    **Flow:** `POST /scan` (analyze, nothing saved) → user reviews/edits → `POST /items` (save).
    Optional live camera: call `POST /detect` repeatedly on small frames to draw a box.

    **Images** are sent as data URLs (`data:image/jpeg;base64,...`) inside JSON.
    Stored images are served from `/media/{id}` and `/media/{id}/thumb` (public, immutable).

    **Auth:** only when the server runs with `ITEMDEX_API_KEY`. Send
    `X-API-Key: <key>` or `Authorization: Bearer <key>`. `/health` and `/meta` are always public.
    With `ACCOUNTS=true` the API key is replaced by sign-in: `POST /auth/login` returns a token,
    sent as `Authorization: Bearer <token>`; every account belongs to a household that shares one collection.
    See docs/API.md for the full guide.
servers:
  - url: /api/v1
    description: This server
  - url: http://localhost:7777/api/v1
    description: Local (npm start / npm run dev)
security:
  - ApiKeyHeader: []
  - BearerAuth: []
tags:
  - name: System
  - name: AI
  - name: Items
  - name: Lifecycle
  - name: Settings
  - name: Accounts
paths:
  /health:
    get:
      operationId: getHealth
      tags: [System]
      summary: Service + AI status
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  version: { type: string, example: '2.0.0' }
                  llm: { type: boolean, description: AI server reachable, example: true }
                  db: { type: boolean, description: PostgreSQL reachable (ok = db), example: true }
                  model: { type: string, example: gold }
                  items: { type: integer, example: 12 }
  /meta:
    get:
      operationId: getMeta
      tags: [System]
      summary: Enums, limits and config for building a UI
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Meta' }
  /detect:
    post:
      operationId: detectItem
      tags: [AI]
      summary: Live detection - find the main item in one camera frame (~0.6s)
      description: |
        Call in a loop (one request in flight at a time) with a ~512px JPEG frame.
        `box` is `[ymin, xmin, ymax, xmax]` normalized to 0-1000 of the image you sent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: 'data:image/jpeg;base64,...' }
      responses:
        '200':
          description: Detection result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Detection' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502': { $ref: '#/components/responses/LlmError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/LlmTimeout' }
  /scan:
    post:
      operationId: scanItem
      tags: [AI]
      summary: Analyze 1-6 images of ONE item into card data (~5s). Not saved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [images]
              properties:
                images:
                  type: array
                  minItems: 1
                  maxItems: 6
                  items: { type: string, description: 'data:image/jpeg;base64,... (~1024px recommended)' }
                hint:
                  type: string
                  maxLength: 300
                  description: Owner's note passed to the AI
                  example: bought 2022, minor scratch on back
                source:
                  type: string
                  enum: [photo, video, camera]
                  description: '"video" tells the AI the images are frames of one clip'
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Card preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScanResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413': { $ref: '#/components/responses/TooLarge' }
        '502': { $ref: '#/components/responses/LlmError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/LlmTimeout' }
  /stats:
    get:
      operationId: getStats
      tags: [Items]
      summary: Collection summary (count, total value, count per type)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /items:
    get:
      operationId: listItems
      tags: [Items]
      summary: List / search the collection
      parameters:
        - { name: q, in: query, schema: { type: string }, description: 'Search name, brand, model, tags, color, material, location place/address' }
        - { name: type, in: query, schema: { type: string }, description: 'Comma list, e.g. ELECTRONIC,TOY' }
        - { name: rarity, in: query, schema: { type: string }, description: 'Comma list, e.g. RARE,EPIC' }
        - { name: sort, in: query, schema: { type: string, enum: [new, old, value, rarity, name, number], default: new } }
        - { name: min_value, in: query, schema: { type: integer }, description: 'value.typical >= this' }
        - { name: max_value, in: query, schema: { type: integer }, description: 'value.typical <= this' }
        - { name: flag, in: query, schema: { type: string, enum: [lent, overdue, sell_now, warranty] }, description: 'lent out / lent past due / at its peak price / warranty ends within 60 days' }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 60 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Item' } }
                  total: { type: integer, description: Matches before limit/offset }
                  total_value: { type: integer, description: Sum of value.typical of all matches }
                  offset: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createItem
      tags: [Items]
      summary: Save a card to the collection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card]
              properties:
                card: { $ref: '#/components/schemas/Card' }
                image: { type: string, description: 'Cover image data URL (usually images[best_frame]), max 8MB' }
                thumb: { type: string, description: 'Optional small version (~360px) for grids; defaults to image' }
                source: { type: string, enum: [photo, video, camera] }
                currency: { type: string, example: USD, description: 'ISO code the card values are in (use ScanResult.currency); default = service currency' }
                location: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      operationId: getItem
      tags: [Items]
      summary: Get one item
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateItem
      tags: [Items]
      summary: Edit card fields (partial; nested objects are merged). PUT is an alias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [card]
              properties:
                card:
                  type: object
                  description: Any subset of Card fields
                  example: { name: My Laptop, rarity: EPIC, value: { typical: 9000000 } }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: deleteItem
      tags: [Items]
      summary: Delete an item, its images and location history
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{id}/location:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: updateItemLocation
      tags: [Items]
      summary: Record where the item is now ("last seen"); keeps the last 20 moves
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /scan/room:
    post:
      operationId: scanRoom
      tags: [AI]
      summary: One photo of a room/shelf/drawer -> a card per visible item (max 12). Not saved.
      description: Each result has a `box` ([ymin, xmin, ymax, xmax], 0-1000) to crop the item; save each with POST /items.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: 'data:image/jpeg;base64,...' }
                hint: { type: string, maxLength: 300 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        card: { $ref: '#/components/schemas/Card' }
                        box: { type: array, nullable: true, items: { type: integer }, minItems: 4, maxItems: 4 }
                  currency: { type: string }
                  elapsed_ms: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/LlmError' }
        '503': { $ref: '#/components/responses/Unavailable' }
        '504': { $ref: '#/components/responses/LlmTimeout' }
  /ask:
    post:
      operationId: askCollection
      tags: [AI]
      summary: Plain-words question -> filters for GET /items
      description: 'Example: "tools in the garage worth over 50k". Returns q, types, rarities, min_value, max_value, sort and flag; pass them to GET /items.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query: { type: string, maxLength: 200 }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Filters
          content:
            application/json:
              schema:
                type: object
                properties:
                  filters:
                    type: object
                    properties:
                      q: { type: string }
                      types: { type: array, items: { type: string } }
                      rarities: { type: array, items: { type: string } }
                      min_value: { type: integer }
                      max_value: { type: integer }
                      sort: { type: string }
                      flag: { type: string, enum: ['', lent, overdue, sell_now, warranty] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '502': { $ref: '#/components/responses/LlmError' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /report:
    get:
      operationId: inventoryReport
      tags: [Lifecycle]
      summary: Inventory for insurance / moving
      description: '`format=csv` (default) downloads a spreadsheet; `format=html` is a printable page (print to PDF). Totals are listed per currency.'
      parameters:
        - { name: format, in: query, schema: { type: string, enum: [csv, html], default: csv } }
      responses:
        '200':
          description: The report
          content:
            text/csv: { schema: { type: string } }
            text/html: { schema: { type: string } }
  /items/{id}/lend:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: lendItem
      tags: [Lifecycle]
      summary: Mark the item as lent out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to: { type: string, maxLength: 80, example: Budi }
                due: { type: string, format: date, nullable: true, description: Return date YYYY-MM-DD }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      operationId: returnItem
      tags: [Lifecycle]
      summary: The item is back
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{id}/purchase:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      operationId: setPurchase
      tags: [Lifecycle]
      summary: Store, date, price and warranty; warranty_until is computed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                store: { type: string }
                date: { type: string, format: date }
                price: { type: integer }
                warranty_months: { type: integer }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
  /items/{id}/receipt:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: readReceipt
      tags: [Lifecycle, AI]
      summary: Read a receipt photo and save it as the item's purchase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, description: 'data:image/jpeg;base64,...' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '422': { description: 'Not a receipt (code not_a_receipt)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/LlmError' }
  /items/{id}/listing:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: writeListing
      tags: [Lifecycle, AI]
      summary: Sale listing text for a marketplace
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                platform: { type: string, enum: [generic, tokopedia, facebook, ebay], default: generic }
                locale: { $ref: '#/components/schemas/Locale' }
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema:
                type: object
                properties:
                  listing:
                    type: object
                    properties:
                      title: { type: string }
                      description: { type: string }
                      price: { type: integer }
                      currency: { type: string }
                      platform: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { $ref: '#/components/responses/LlmError' }
  /items/{id}/comps:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      operationId: checkPrice
      tags: [Lifecycle]
      summary: Check the value against Shopee listings (needs a connected Shopee session, IDR items only)
      description: With 3+ matching listings the value is set to the 25th/50th/75th percentile of their prices (lowered by COMPS_DISCOUNT). Otherwise the AI estimate stays. Takes about 15 seconds.
      responses:
        '200':
          description: Updated (see `comps`)
          content:
            application/json:
              schema:
                type: object
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '409': { description: 'Shopee not connected (code not_connected)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '502': { description: 'Browser or Shopee problem (code comps_error)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /shopee:
    get:
      operationId: shopeeStatus
      tags: [Settings]
      summary: Is a Shopee session saved?
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/ShopeeStatus' } } }
    delete:
      operationId: shopeeDisconnect
      tags: [Settings]
      summary: Delete the saved Shopee session
      responses:
        '200':
          description: Status
          content: { application/json: { schema: { $ref: '#/components/schemas/ShopeeStatus' } } }
  /shopee/login:
    post:
      operationId: shopeeLogin
      tags: [Settings]
      summary: Open a browser window on the service machine so the user can log in to Shopee
      description: Local only (HOST=127.0.0.1). Poll GET /shopee until state is done. Only the browser session is saved, never the password.
      responses:
        '200':
          description: Status (state waiting)
          content: { application/json: { schema: { $ref: '#/components/schemas/ShopeeStatus' } } }
        '403': { description: 'Service is not running locally (code remote)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /settings/ai:
    get:
      operationId: getAiSettings
      tags: [Settings]
      summary: Current AI server URL and model (the key is never returned)
      responses:
        '200':
          description: OK
          content: { application/json: { schema: { $ref: '#/components/schemas/AiConfig' } } }
    put:
      operationId: setAiSettings
      tags: [Settings]
      summary: Point the service at a vision model (Claude, DeepSeek, Gemini, OpenAI, Ollama, vLLM, ...). Takes effect immediately
      description: A URL with only a host gets /v1 added, a URL with a path is used as is (Gemini is https://generativelanguage.googleapis.com/v1beta/openai). Claude subscriptions cannot be used, only API keys. Saved in the database and overrides LLM_API_BASE / LLM_API_KEY / LLM_MODEL. Omit `api_key` to keep the saved one. With accounts, only the first account may call this.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base_url, model]
              properties:
                base_url: { type: string, example: 'https://your-ai-server/v1' }
                model: { type: string }
                api_key: { type: string }
                clear_key: { type: boolean }
      responses:
        '200':
          description: Saved
          content: { application/json: { schema: { $ref: '#/components/schemas/AiConfig' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: 'Not the first account (code forbidden)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /settings/ai/test:
    post:
      operationId: testAiSettings
      tags: [Settings]
      summary: Try a URL/key/model without saving; lists the models and checks that the model accepts an image
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                base_url: { type: string }
                model: { type: string }
                api_key: { type: string }
      responses:
        '200':
          description: Always 200; read `ok` and `message`
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  message: { type: string }
                  models: { type: array, items: { type: string } }
        '403': { description: 'Not the first account (code forbidden)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/register:
    post:
      operationId: register
      tags: [Accounts]
      summary: Create an account (only with ACCOUNTS=true)
      security: []
      description: Without `invite_code` a new household is created; with one, the user joins that household and sees its collection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, minLength: 8 }
                name: { type: string }
                invite_code: { type: string }
      responses:
        '201':
          description: Signed in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { description: 'Email already registered', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/login:
    post:
      operationId: login
      tags: [Accounts]
      summary: Sign in; the token lasts 30 days
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      operationId: me
      tags: [Accounts]
      summary: Current user and household (name, invite_code, members)
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/logout:
    post:
      operationId: logout
      tags: [Accounts]
      summary: End the session
      responses:
        '200': { description: OK }
components:
  securitySchemes:
    ApiKeyHeader: { type: apiKey, in: header, name: X-API-Key }
    BearerAuth: { type: http, scheme: bearer }
  responses:
    BadRequest:
      description: Invalid input
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Missing or invalid API key
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Not found
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooLarge:
      description: Request body over BODY_LIMIT_MB (default 40MB)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LlmError:
      description: AI server returned an error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    LlmTimeout:
      description: AI did not answer in time
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unavailable:
      description: AI server unreachable / not configured (llm_unavailable), or database down (db_unavailable)
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      properties:
        error: { type: string, example: Item not found }
        code:
          type: string
          enum: [bad_request, unauthorized, forbidden, not_found, payload_too_large, llm_error, llm_unavailable, llm_timeout, db_unavailable, not_a_receipt, not_connected, no_comps, comps_error, browser_error, remote, auth_error, internal]
    Meta:
      type: object
      properties:
        version: { type: string }
        model: { type: string }
        currency: { type: string, example: IDR }
        language: { type: string, example: Indonesian }
        market: { type: string, example: Indonesian }
        auth_required: { type: boolean }
        accounts: { type: boolean, description: 'Sign-in required (ACCOUNTS=true)' }
        enums:
          type: object
          properties:
            type: { type: array, items: { type: string } }
            rarity: { type: array, items: { type: string } }
            condition: { type: array, items: { type: string } }
            size_class: { type: array, items: { type: string } }
            source: { type: array, items: { type: string } }
            sort: { type: array, items: { type: string } }
        limits:
          type: object
          properties:
            max_images_per_scan: { type: integer, example: 6 }
            max_body_mb: { type: integer, example: 40 }
            recommended_scan_image_side_px: { type: integer, example: 1024 }
            recommended_detect_image_side_px: { type: integer, example: 512 }
            thumb_side_px: { type: integer, example: 360 }
    Stats:
      type: object
      properties:
        total: { type: integer, example: 31 }
        total_value: { type: integer, example: 48250000 }
        types:
          type: object
          additionalProperties: { type: integer }
          example: { ELECTRONIC: 12, TOY: 3 }
        flags:
          type: object
          description: Counts for the lifecycle filters (GET /items?flag=)
          properties:
            lent: { type: integer }
            overdue: { type: integer }
            sell_now: { type: integer }
            warranty: { type: integer }
    Detection:
      type: object
      properties:
        has_item: { type: boolean, example: true }
        name: { type: string, example: laptop }
        box:
          type: array
          nullable: true
          minItems: 4
          maxItems: 4
          items: { type: integer, minimum: 0, maximum: 1000 }
          description: '[ymin, xmin, ymax, xmax], 0-1000'
          example: [456, 526, 748, 886]
        elapsed_ms: { type: integer, example: 640 }
    ScanResult:
      type: object
      properties:
        card: { $ref: '#/components/schemas/Card' }
        best_frame: { type: integer, description: 'Index in images[] that shows the item best', example: 0 }
        currency: { type: string, example: IDR, description: Currency of the card values }
        elapsed_ms: { type: integer, example: 4700 }
    Locale:
      type: object
      description: Per-request override of the card language, currency and resale market (defaults come from CARD_LANGUAGE, CURRENCY, MARKET)
      properties:
        language: { type: string, example: English }
        currency: { type: string, example: USD }
        market: { type: string, example: US }
    Card:
      type: object
      description: AI-generated card data. Text fields are in CARD_LANGUAGE, money in CURRENCY.
      properties:
        is_item: { type: boolean, description: false if the AI found no physical item }
        name: { type: string, maxLength: 40, example: MacBook 12-inch Gold }
        brand: { type: string, example: Apple }
        model: { type: string, example: 'MacBook (Retina, 12-inch)' }
        type:
          type: string
          enum: [ELECTRONIC, FASHION, BOOK, TOY, HOME, KITCHEN, SPORT, TOOL, COLLECTIBLE, BEAUTY, VEHICLE, MUSIC, OFFICE, OTHER]
        subcategory: { type: string, example: Laptop }
        description: { type: string, description: Pokedex-style flavor text }
        color: { type: string }
        material: { type: string }
        dimensions:
          type: object
          properties:
            length_cm: { type: number, example: 28.1 }
            width_cm: { type: number, example: 19.6 }
            height_cm: { type: number, example: 1.3 }
        size_class:
          type: string
          enum: [TINY, SMALL, MEDIUM, LARGE, HUGE]
          description: Derived from the longest dimension (<8, <25, <70, <150 cm, else HUGE)
        weight_g: { type: integer, example: 1080 }
        condition:
          type: object
          properties:
            score: { type: integer, minimum: 0, maximum: 100, description: Shown as HP on the card }
            label: { type: string, enum: [MINT, EXCELLENT, GOOD, FAIR, POOR] }
            notes: { type: string }
        value:
          type: object
          description: Second-hand resale estimate (AI, not a quote)
          properties:
            min: { type: integer, example: 4000000 }
            max: { type: integer, example: 7000000 }
            typical: { type: integer, example: 5500000 }
            new_price: { type: integer, example: 15000000 }
            confidence: { type: string, enum: [LOW, MEDIUM, HIGH] }
            reasoning: { type: string }
        rarity: { type: string, enum: [COMMON, UNCOMMON, RARE, EPIC, LEGENDARY] }
        abilities:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: object
            properties:
              name: { type: string, example: Retina Vision }
              power: { type: integer, example: 85 }
              text: { type: string }
        tags: { type: array, maxItems: 6, items: { type: string } }
        location_guess: { type: string, description: 'Where the item seems to be, from the photo background', example: meja kerja }
    Item:
      allOf:
        - $ref: '#/components/schemas/Card'
        - type: object
          properties:
            id: { type: string, format: uuid }
            number: { type: integer, description: Collection number (NO.001), example: 1 }
            image_url: { type: string, nullable: true, description: 'Absolute URL of the full cover image (public, no auth)' }
            thumb_url: { type: string, nullable: true, description: 'Absolute URL of the thumbnail for grids (public, no auth)' }
            source: { type: string, enum: [photo, video, camera] }
            currency: { type: string, example: IDR, description: Currency of value.* }
            lent:
              type: object
              nullable: true
              properties:
                to: { type: string }
                at: { type: string, format: date-time }
                due: { type: string, format: date, nullable: true }
            purchase: { $ref: '#/components/schemas/Purchase' }
            comps: { $ref: '#/components/schemas/Comps' }
            value_history:
              type: array
              description: 'Price points, oldest first (only in GET /items/{id}); a point is added whenever value.typical changes'
              items:
                type: object
                properties:
                  typical: { type: integer }
                  at: { type: string, format: date-time }
            sell_now: { type: boolean, description: 'value.typical is the all-time high and 10%+ above the first recorded value' }
            location: { $ref: '#/components/schemas/Location' }
            location_history: { type: array, items: { $ref: '#/components/schemas/Location' }, description: 'Newest first, max 20. Empty in list responses; use GET /items/{id}.' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    Purchase:
      type: object
      nullable: true
      properties:
        store: { type: string }
        date: { type: string, format: date, nullable: true }
        price: { type: integer }
        warranty_months: { type: integer }
        warranty_until: { type: string, format: date, nullable: true }
    Comps:
      type: object
      nullable: true
      description: Last Shopee price check
      properties:
        query: { type: string }
        engine: { type: string, example: shopee }
        n: { type: integer, description: Listings used }
        median: { type: integer }
        low: { type: integer, description: 25th percentile }
        high: { type: integer, description: 75th percentile }
        sources:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              price: { type: integer }
              url: { type: string }
              site: { type: string }
        at: { type: string, format: date-time }
    AiConfig:
      type: object
      properties:
        base_url: { type: string, example: 'https://your-ai-server' }
        model: { type: string }
        provider: { type: string, enum: [openai, anthropic], description: 'Detected from the URL: api.anthropic.com uses the native Claude API, everything else is OpenAI-compatible' }
        has_key: { type: boolean, description: The key itself is never returned }
        source: { type: string, enum: [app, env, none], description: 'app = saved in the app (overrides env)' }
        editable: { type: boolean, description: 'false for non-first accounts when ACCOUNTS=true' }
    ShopeeStatus:
      type: object
      properties:
        available: { type: boolean, description: 'Login can be started (service runs on this machine)' }
        connected: { type: boolean }
        state: { type: string, enum: [idle, waiting, done, error] }
        message: { type: string }
    Session:
      type: object
      properties:
        token: { type: string }
        user: { type: object, properties: { id: { type: string }, email: { type: string }, name: { type: string } } }
        household: { type: object, properties: { id: { type: string }, name: { type: string } } }
    LocationInput:
      type: object
      description: Provide place and/or lat+lng
      properties:
        place: { type: string, maxLength: 80, example: 'lemari kamar, rak 2' }
        lat: { type: number, example: -6.2297 }
        lng: { type: number, example: 106.8295 }
        accuracy_m: { type: number, example: 25 }
        source: { type: string, enum: [exif, device], description: Where the coordinates came from }
    Location:
      type: object
      nullable: true
      properties:
        place: { type: string }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        accuracy_m: { type: integer, nullable: true }
        source: { type: string, enum: [exif, device, manual] }
        address: { type: string, description: Reverse-geocoded street address (may be empty) }
        at: { type: string, format: date-time }
