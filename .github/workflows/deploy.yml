name: Deploy to Cloud Run

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: 'read'
  id-token: 'write'

env:
  REGION: us-central1
  SERVICE_NAME: itemdex
  REPO_NAME: itemdex-repo

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE="${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/itemdex:latest"
          docker build -t $IMAGE .
          docker push $IMAGE

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.REPO_NAME }}/itemdex:latest
          flags: |
            --memory=512Mi
            --cpu=1
            --min-instances=0
            --max-instances=1
            --concurrency=10
            --timeout=120s
            --allow-unauthenticated
          env_vars: |
            NODE_ENV=production
            HOST=0.0.0.0
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            LLM_API_BASE=${{ secrets.LLM_API_BASE }}
            LLM_API_KEY=${{ secrets.LLM_API_KEY || 'sk-9router' }}
            LLM_MODEL=${{ secrets.LLM_MODEL || 'ag/gemini-3-flash' }}
            DB_POOL_MAX=2

      - name: Show Cloud Run URL
        run: echo "Itemdex is live at ${{ steps.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
